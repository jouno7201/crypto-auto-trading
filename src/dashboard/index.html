<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>코인 자동매매</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #0d1117;
        color: #c9d1d9;
        min-height: 100vh;
      }
      .pos {
        color: #3fb950 !important;
      }
      .neg {
        color: #f85149 !important;
      }

      /* Header */
      .hdr {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 20px;
        background: #161b22;
        border-bottom: 1px solid #30363d;
      }
      .hdr h1 {
        font-size: 15px;
        color: #58a6ff;
      }
      .hdr-r {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .ws-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #da3633;
        display: inline-block;
      }
      .ws-dot.on {
        background: #3fb950;
      }
      .ws-lbl {
        font-size: 11px;
        color: #8b949e;
      }

      /* Tabs */
      .tabs {
        display: flex;
        padding: 0 20px;
        background: #161b22;
        border-bottom: 1px solid #30363d;
      }
      .tab {
        padding: 9px 18px;
        font-size: 13px;
        font-weight: 600;
        color: #8b949e;
        cursor: pointer;
        border-bottom: 2px solid transparent;
      }
      .tab.active {
        color: #58a6ff;
        border-bottom-color: #58a6ff;
      }
      .tab:hover {
        color: #c9d1d9;
      }
      .tp {
        display: none;
      }
      .tp.active {
        display: block;
      }

      /* Cards */
      .cards {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        padding: 14px 20px;
      }
      .card {
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 8px;
        padding: 12px;
      }
      .card-lbl {
        font-size: 11px;
        color: #8b949e;
        margin-bottom: 3px;
      }
      .card-val {
        font-size: 18px;
        font-weight: 700;
      }
      .card-sub {
        font-size: 11px;
        color: #8b949e;
        margin-top: 2px;
      }

      /* Layout */
      .main {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 14px;
        padding: 0 20px 14px;
      }
      .chart-box {
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 8px;
        padding: 12px;
      }
      .chart-hdr {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 6px;
      }
      .chart-hdr h2 {
        font-size: 13px;
      }
      .side {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .sec {
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 8px;
        padding: 12px;
      }
      .sec h3 {
        font-size: 12px;
        color: #8b949e;
        margin-bottom: 8px;
        border-bottom: 1px solid #21262d;
        padding-bottom: 5px;
      }

      /* Buttons */
      .btn {
        padding: 6px 12px;
        border: none;
        border-radius: 5px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      .btn-go {
        background: #238636;
        color: #fff;
      }
      .btn-go:hover {
        background: #2ea043;
      }
      .btn-stop {
        background: #da3633;
        color: #fff;
      }
      .btn-stop:hover {
        background: #f85149;
      }
      .btn-pri {
        background: #1f6feb;
        color: #fff;
      }
      .btn-pri:hover {
        background: #388bfd;
      }
      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      /* Forms */
      .fg {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 8px;
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 8px;
        padding: 14px;
        margin-bottom: 12px;
      }
      .fg label {
        font-size: 11px;
        color: #8b949e;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .fg select,
      .fg input {
        background: #0d1117;
        color: #c9d1d9;
        border: 1px solid #30363d;
        padding: 5px 7px;
        border-radius: 4px;
        font-size: 12px;
      }
      .fg .full {
        grid-column: 1/-1;
      }
      .sm-sel {
        background: #0d1117;
        color: #c9d1d9;
        border: 1px solid #30363d;
        padding: 4px 6px;
        border-radius: 4px;
        font-size: 12px;
      }
      .bot-cfg {
        display: flex;
        flex-direction: column;
        gap: 5px;
        margin-bottom: 8px;
      }
      .bot-cfg label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 11px;
        color: #8b949e;
      }
      .bot-cfg select {
        background: #0d1117;
        border: 1px solid #30363d;
        color: #c9d1d9;
        padding: 4px 6px;
        border-radius: 4px;
        font-size: 12px;
        flex: 1;
        margin-left: 6px;
      }

      /* Table */
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      th {
        text-align: left;
        padding: 6px 8px;
        color: #8b949e;
        border-bottom: 1px solid #30363d;
        font-weight: 600;
      }
      td {
        padding: 6px 8px;
        border-bottom: 1px solid #21262d;
      }

      /* Toast */
      .toast-wrap {
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .toast {
        padding: 10px 16px;
        border-radius: 6px;
        font-size: 12px;
        color: #fff;
        animation: fadeIn 0.3s;
      }
      .toast-ok {
        background: #238636;
      }
      .toast-err {
        background: #da3633;
      }
      .toast-warn {
        background: #d29922;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Result box */
      .res-box {
        background: #0d1117;
        border: 1px solid #30363d;
        border-radius: 8px;
        padding: 14px;
        margin-top: 10px;
      }
      .res-box h4 {
        font-size: 13px;
        margin-bottom: 8px;
        color: #58a6ff;
      }
      .metric {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        padding: 3px 0;
        border-bottom: 1px solid #21262d;
      }
      .metric:last-child {
        border: none;
      }

      /* Scrollable */
      .scroll-y {
        max-height: 300px;
        overflow-y: auto;
      }
    </style>
  </head>
  <body>
    <!-- Header -->
    <div class="hdr">
      <h1>🪙 코인 자동매매</h1>
      <div class="hdr-r">
        <span class="ws-dot" id="wsDot"></span>
        <span class="ws-lbl" id="wsLbl">끊김</span>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <div class="tab active" onclick="switchTab('trading', this)">트레이딩</div>
      <div class="tab" onclick="switchTab('verify', this)">전략 검증</div>
      <div class="tab" onclick="switchTab('reports', this)">리포트</div>
    </div>

    <!-- ========== Tab 1: Trading ========== -->
    <div class="tp active" id="tab-trading">
      <div class="cards">
        <div class="card">
          <div class="card-lbl">현재가</div>
          <div class="card-val" id="curPrice">-</div>
          <div class="card-sub" id="priceChg">-</div>
        </div>
        <div class="card">
          <div class="card-lbl">수익률</div>
          <div class="card-val" id="totalPnl">-</div>
          <div class="card-sub" id="winRate">-</div>
        </div>
        <div class="card">
          <div class="card-lbl">거래 수</div>
          <div class="card-val" id="tradeCount">0</div>
          <div class="card-sub" id="todayCount">오늘 0건</div>
        </div>
        <div class="card">
          <div class="card-lbl">봇 상태</div>
          <div class="card-val" id="botState">정지</div>
          <div class="card-sub" id="botStrategy">-</div>
        </div>
      </div>
      <div class="main">
        <div class="chart-box">
          <div class="chart-hdr">
            <h2 id="chartTitle">KRW-BTC</h2>
            <select class="sm-sel" id="chartUnit" onchange="loadCandles()">
              <option value="1">1분</option>
              <option value="5">5분</option>
              <option value="15">15분</option>
              <option value="60" selected>1시간</option>
              <option value="240">4시간</option>
              <option value="1440">일봉</option>
            </select>
          </div>
          <div id="chart" style="height: 380px"></div>
        </div>
        <div class="side">
          <div class="sec">
            <h3>봇 설정</h3>
            <div class="bot-cfg">
              <label
                >마켓
                <select id="botMarket">
                  <option>KRW-BTC</option>
                  <option>KRW-ETH</option>
                  <option>KRW-XRP</option>
                  <option>KRW-SOL</option>
                  <option>KRW-DOGE</option>
                </select></label
              >
              <label
                >전략
                <select id="botStratSel">
                  <option value="ma-cross">MA Cross</option>
                  <option value="rsi">RSI</option>
                  <option value="bollinger">Bollinger</option>
                  <option value="macd">MACD</option>
                  <option value="triple-ema">Triple EMA</option>
                  <option value="combo">Combo</option>
                  <option value="mean-reversion">Mean Reversion</option>
                  <option value="volatility">Volatility</option>
                  <option value="adaptive-momentum">Adaptive Momentum</option>
                  <option value="ensemble">Ensemble</option>
                  <option value="smart-range">Smart Range</option>
                </select></label
              >
              <label
                >봉 단위
                <select id="botUnitSel">
                  <option value="1">1분</option>
                  <option value="5">5분</option>
                  <option value="15">15분</option>
                  <option value="60" selected>1시간</option>
                  <option value="240">4시간</option>
                </select></label
              >
            </div>
            <div style="display: flex; gap: 6px">
              <button class="btn btn-go" onclick="applyConfig()">적용</button>
              <button class="btn btn-go" id="btnStart" onclick="sendWS('startBot')">▶ 시작</button>
              <button class="btn btn-stop" id="btnStop" onclick="sendWS('stopBot')">⏹ 정지</button>
            </div>
          </div>
          <div class="sec">
            <h3>최근 거래</h3>
            <div class="scroll-y">
              <table>
                <thead>
                  <tr>
                    <th>시각</th>
                    <th>타입</th>
                    <th>가격</th>
                    <th>수익</th>
                  </tr>
                </thead>
                <tbody id="tradeBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ========== Tab 2: Strategy Verification ========== -->
    <div class="tp" id="tab-verify">
      <h3 style="padding: 14px 20px 0; font-size: 14px">전략 검증 (백테스트 → 워크포워드)</h3>

      <!-- Step 1: Backtest -->
      <div style="padding: 10px 20px">
        <div class="fg">
          <label
            >마켓
            <select id="btMarket">
              <option>KRW-BTC</option>
              <option>KRW-ETH</option>
              <option>KRW-XRP</option>
              <option>KRW-SOL</option>
            </select></label
          >
          <label
            >전략
            <select id="btStrat">
              <option value="ma-cross">MA Cross</option>
              <option value="rsi">RSI</option>
              <option value="bollinger">Bollinger</option>
              <option value="macd">MACD</option>
              <option value="triple-ema">Triple EMA</option>
              <option value="combo">Combo</option>
              <option value="mean-reversion">Mean Reversion</option>
              <option value="volatility">Volatility</option>
              <option value="adaptive-momentum">Adaptive Momentum</option>
              <option value="ensemble">Ensemble</option>
              <option value="smart-range">Smart Range</option>
            </select></label
          >
          <label
            >봉 단위
            <select id="btUnit">
              <option value="1">1분</option>
              <option value="5">5분</option>
              <option value="15">15분</option>
              <option value="60" selected>1시간</option>
              <option value="240">4시간</option>
            </select></label
          >
          <label>캔들 수 <input type="number" id="btCount" value="500" min="50" max="2000" /></label>
          <label>초기자본 <input type="number" id="btCapital" value="1000000" step="100000" /></label>
          <label>수수료(%) <input type="number" id="btFee" value="0.05" step="0.01" /></label>
          <label class="full"
            ><button class="btn btn-pri" id="btnBt" onclick="runBacktest()">1단계: 백테스트 실행</button></label
          >
        </div>
        <div id="btResult"></div>
      </div>

      <!-- Step 2: Walk-Forward -->
      <div style="padding: 0 20px 14px">
        <div class="fg">
          <label>시작일 <input type="date" id="wfStart" /></label>
          <label>종료일 <input type="date" id="wfEnd" /></label>
          <label>훈련 비율(%) <input type="number" id="wfTrain" value="70" min="50" max="90" /></label>
          <label>윈도우 수 <input type="number" id="wfFolds" value="4" min="2" max="10" /></label>
          <label class="full"
            ><button class="btn btn-pri" id="btnWf" onclick="runWalkForward()">2단계: 워크포워드 검증</button></label
          >
        </div>
        <div id="wfResult"></div>
      </div>

      <!-- History -->
      <div style="padding: 0 20px 14px">
        <div class="sec">
          <h3>검증 히스토리</h3>
          <div class="scroll-y">
            <table>
              <thead>
                <tr>
                  <th>일시</th>
                  <th>마켓</th>
                  <th>전략</th>
                  <th>수익률</th>
                  <th>승률</th>
                  <th>MDD</th>
                </tr>
              </thead>
              <tbody id="btHistory"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- ========== Tab 3: Reports ========== -->
    <div class="tp" id="tab-reports">
      <div style="padding: 14px 20px">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px">
          <h3 style="font-size: 14px">리포트</h3>
          <button class="btn btn-go" onclick="generateReport()">📊 리포트 생성</button>
        </div>

        <!-- Summary -->
        <div class="cards" style="padding: 0; margin-bottom: 12px">
          <div class="card">
            <div class="card-lbl">총 거래</div>
            <div class="card-val" id="rpTrades">-</div>
          </div>
          <div class="card">
            <div class="card-lbl">승률</div>
            <div class="card-val" id="rpWinRate">-</div>
          </div>
          <div class="card">
            <div class="card-lbl">총 수익</div>
            <div class="card-val" id="rpProfit">-</div>
          </div>
          <div class="card">
            <div class="card-lbl">평균 수익</div>
            <div class="card-val" id="rpAvg">-</div>
          </div>
        </div>

        <!-- Report list -->
        <div class="sec">
          <h3>생성된 리포트</h3>
          <div class="scroll-y">
            <table>
              <thead>
                <tr>
                  <th>파일</th>
                  <th>생성일</th>
                  <th>다운로드</th>
                </tr>
              </thead>
              <tbody id="rpList"></tbody>
            </table>
          </div>
        </div>

        <!-- Report detail -->
        <div id="rpDetail"></div>
      </div>
    </div>

    <div class="toast-wrap" id="toastWrap"></div>

    <!-- Login Modal -->
    <div
      id="loginOverlay"
      style="
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        z-index: 10000;
        display: flex;
        align-items: center;
        justify-content: center;
      "
    >
      <div style="background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 28px; width: 340px">
        <h3 style="color: #58a6ff; margin-bottom: 14px; font-size: 15px">🔐 로그인</h3>
        <p style="font-size: 12px; color: #8b949e; margin-bottom: 12px">API 토큰을 입력하세요 (.env의 API_TOKEN)</p>
        <input
          type="password"
          id="loginToken"
          placeholder="API Token"
          style="
            width: 100%;
            padding: 8px 10px;
            background: #0d1117;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 5px;
            font-size: 13px;
            margin-bottom: 10px;
          "
        />
        <button class="btn btn-pri" onclick="doLogin()" style="width: 100%">로그인</button>
        <p id="loginErr" style="color: #f85149; font-size: 11px; margin-top: 8px; display: none"></p>
      </div>
    </div>

    <script>
      // ===== Utility =====
      function $(id) {
        return document.getElementById(id);
      }
      function showToast(type, msg) {
        var d = document.createElement('div');
        d.className = 'toast toast-' + (type === 'error' ? 'err' : type === 'warning' ? 'warn' : 'ok');
        d.textContent = msg;
        $('toastWrap').appendChild(d);
        setTimeout(function () {
          d.remove();
        }, 3000);
      }
      function fmtNum(n) {
        return n == null ? '-' : Number(n).toLocaleString();
      }
      function fmtPct(n) {
        return n == null ? '-' : (n >= 0 ? '+' : '') + Number(n).toFixed(2) + '%';
      }
      function fmtDate(d) {
        if (!d) return '-';
        var t = new Date(d);
        return t.toLocaleDateString('ko') + ' ' + t.toLocaleTimeString('ko', { hour: '2-digit', minute: '2-digit' });
      }

      // ===== Tabs =====
      function switchTab(name, el) {
        document.querySelectorAll('.tab').forEach(function (t) {
          t.classList.remove('active');
        });
        document.querySelectorAll('.tp').forEach(function (t) {
          t.classList.remove('active');
        });
        el.classList.add('active');
        $('tab-' + name).classList.add('active');
        if (name === 'verify') loadBtHistory();
        if (name === 'reports') {
          loadRpList();
          loadRpSummary();
        }
      }

      // ===== Auth =====
      function getToken() {
        return localStorage.getItem('auth_token') || '';
      }
      function setToken(t) {
        localStorage.setItem('auth_token', t);
      }
      function showLogin() {
        $('loginOverlay').style.display = 'flex';
      }
      function hideLogin() {
        $('loginOverlay').style.display = 'none';
      }
      async function doLogin() {
        var secret = $('loginToken').value.trim();
        if (!secret) return;
        $('loginErr').style.display = 'none';
        try {
          var res = await fetch('/api/auth/token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ secret: secret }),
          });
          var data = await res.json();
          if (res.ok && data.token) {
            setToken(data.token);
            hideLogin();
            showToast('ok', '로그인 성공');
            connectWS();
            loadCandles();
            loadTrades();
          } else {
            $('loginErr').textContent = data.error || '인증 실패';
            $('loginErr').style.display = 'block';
          }
        } catch (e) {
          $('loginErr').textContent = '서버 연결 오류';
          $('loginErr').style.display = 'block';
        }
      }
      // Enter key to login
      document.addEventListener('DOMContentLoaded', function () {
        $('loginToken').addEventListener('keydown', function (e) {
          if (e.key === 'Enter') doLogin();
        });
      });
      async function api(url, opts) {
        opts = opts || {};
        var h = Object.assign({}, opts.headers || {});
        var tk = getToken();
        if (tk) h['Authorization'] = 'Bearer ' + tk;
        try {
          var res = await fetch(url, Object.assign({}, opts, { headers: h }));
          if (res.status === 401) {
            showLogin();
            return res;
          }
          return res;
        } catch (e) {
          showToast('error', '네트워크 오류');
          return null;
        }
      }
      // Auto-check token on load
      (function () {
        // Try API without token first — if auth is disabled, it'll return 200
        fetch('/api/strategies').then(function (r) {
          if (r.ok) {
            hideLogin();
            return;
          }
          // Auth is enabled — check if we have a valid token
          var tk = getToken();
          if (!tk) {
            showLogin();
          } else {
            fetch('/api/strategies', { headers: { Authorization: 'Bearer ' + tk } }).then(function (r2) {
              if (r2.status === 401) showLogin();
              else hideLogin();
            });
          }
        });
      })();

      // ===== WebSocket =====
      var ws,
        curPrice = 0;
      function setWs(s) {
        var d = $('wsDot'),
          l = $('wsLbl');
        d.className = 'ws-dot';
        if (s === 'on') {
          d.classList.add('on');
          l.textContent = '실시간';
        } else if (s === 'ing') {
          d.style.background = '#d29922';
          l.textContent = '연결 중';
        } else l.textContent = '끊김';
      }
      function connectWS() {
        setWs('ing');
        var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        var tk = getToken();
        var url = proto + '//' + location.host + (tk ? '?token=' + encodeURIComponent(tk) : '');
        ws = new WebSocket(url);
        ws.onopen = function () {
          setWs('on');
        };
        ws.onmessage = function (e) {
          var m = JSON.parse(e.data);
          if (m.type === 'ticker') updateTicker(m.data);
          if (m.type === 'botStatus') updateBot(m.data);
        };
        ws.onclose = function () {
          setWs('off');
          setTimeout(connectWS, 3000);
        };
      }
      connectWS();
      function sendWS(type) {
        if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: type }));
      }

      // ===== Bot Config =====
      function applyConfig() {
        var market = $('botMarket').value,
          strat = $('botStratSel').value,
          unit = $('botUnitSel').value;
        if (ws && ws.readyState === 1)
          ws.send(JSON.stringify({ type: 'configBot', data: { market: market, strategyName: strat, unit: unit } }));
        $('chartTitle').textContent = market;
        loadCandles();
      }

      // ===== Ticker =====
      function updateTicker(tick) {
        curPrice = tick.price;
        $('curPrice').textContent = fmtNum(tick.price) + '원';
        var pct = (tick.change * 100).toFixed(2);
        var el = $('priceChg');
        el.textContent = (pct > 0 ? '+' : '') + pct + '%';
        el.className = 'card-sub ' + (pct >= 0 ? 'pos' : 'neg');
      }

      // ===== Bot Status =====
      function updateBot(s) {
        $('botState').textContent = s.running ? '실행 중' : '정지';
        $('botState').className = 'card-val ' + (s.running ? 'pos' : '');
        $('botStrategy').textContent = (s.market || '-') + ' / ' + (s.strategyName || '-');
        $('totalPnl').textContent = fmtPct(s.totalReturn);
        $('totalPnl').className = 'card-val ' + ((s.totalReturn || 0) >= 0 ? 'pos' : 'neg');
        $('winRate').textContent = '승률 ' + (s.winRate != null ? s.winRate.toFixed(1) + '%' : '-');
        $('tradeCount').textContent = s.tradeCount || 0;
      }

      // ===== Chart =====
      var chart, candleSeries;
      function initChart() {
        chart = LightweightCharts.createChart($('chart'), {
          layout: { background: { color: '#161b22' }, textColor: '#8b949e' },
          grid: { vertLines: { color: '#21262d' }, horzLines: { color: '#21262d' } },
          crosshair: { mode: 0 },
          timeScale: { timeVisible: true, secondsVisible: false },
        });
        candleSeries = chart.addCandlestickSeries({
          upColor: '#3fb950',
          downColor: '#f85149',
          borderVisible: false,
          wickUpColor: '#3fb950',
          wickDownColor: '#f85149',
        });
        new ResizeObserver(function () {
          chart.applyOptions({ width: $('chart').clientWidth });
        }).observe($('chart'));
      }
      initChart();

      async function loadCandles() {
        var market = $('botMarket').value;
        var unit = $('chartUnit').value;
        var res = await api('/api/assets/candles/' + encodeURIComponent(market) + '?unit=' + unit + '&count=200');
        if (!res || !res.ok) return;
        var data = await res.json();
        var arr = Array.isArray(data) ? data : data.candles || [];
        if (!arr.length) return;
        var mapped = arr.map(function (c) {
          return {
            time: Math.floor(new Date(c.timestamp).getTime() / 1000),
            open: c.open,
            high: c.high,
            low: c.low,
            close: c.close,
          };
        });
        candleSeries.setData(mapped);
      }

      // ===== Trades =====
      async function loadTrades() {
        var res = await api('/api/trades?limit=20');
        if (!res || !res.ok) return;
        var data = await res.json();
        var rows = data.trades || data || [];
        $('tradeBody').innerHTML = rows
          .map(function (t) {
            var pnl = t.pnl || t.profit || 0;
            return (
              '<tr><td>' +
              fmtDate(t.timestamp || t.time) +
              '</td><td>' +
              (t.type || t.side || '-') +
              '</td><td>' +
              fmtNum(t.price) +
              '</td><td class="' +
              (pnl >= 0 ? 'pos' : 'neg') +
              '">' +
              fmtPct(pnl) +
              '</td></tr>'
            );
          })
          .join('');
      }

      // ===== Backtest =====
      async function runBacktest() {
        $('btnBt').disabled = true;
        $('btnBt').textContent = '실행 중...';
        var p = {
          market: $('btMarket').value,
          strategy: $('btStrat').value,
          unit: $('btUnit').value,
          count: parseInt($('btCount').value),
          capital: parseInt($('btCapital').value),
          feeRate: parseFloat($('btFee').value) / 100,
        };
        try {
          var res = await api('/api/assets/backtest/run', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(p),
          });
          if (!res || !res.ok) {
            showToast('error', '백테스트 실패');
            return;
          }
          var d = await res.json();
          var perf = d.performance || {};
          var tr = d.trades || {};
          $('btResult').innerHTML =
            '<div class="res-box"><h4>백테스트 결과</h4>' +
            '<div class="metric"><span>총 수익률</span><span class="' +
            ((perf.totalReturn || 0) >= 0 ? 'pos' : 'neg') +
            '">' +
            fmtPct(perf.totalReturn) +
            '</span></div>' +
            '<div class="metric"><span>거래 수</span><span>' +
            (tr.total || 0) +
            '</span></div>' +
            '<div class="metric"><span>승률</span><span>' +
            ((tr.winRate || 0) * 100).toFixed(1) +
            '%</span></div>' +
            '<div class="metric"><span>샤프 비율</span><span>' +
            (perf.sharpeRatio || 0).toFixed(2) +
            '</span></div>' +
            '<div class="metric"><span>MDD</span><span class="neg">' +
            ((perf.maxDrawdown || 0) * 100).toFixed(2) +
            '%</span></div>' +
            '<div class="metric"><span>Profit Factor</span><span>' +
            (perf.profitFactor || 0).toFixed(2) +
            '</span></div>' +
            '</div>';
          showToast('ok', '백테스트 완료 — 2단계 워크포워드를 실행하세요');
        } catch (e) {
          showToast('error', e.message);
        } finally {
          $('btnBt').disabled = false;
          $('btnBt').textContent = '1단계: 백테스트 실행';
        }
      }

      async function runWalkForward() {
        $('btnWf').disabled = true;
        $('btnWf').textContent = '실행 중...';
        var body = {
          market: $('btMarket').value,
          strategy: $('btStrat').value,
          unit: $('btUnit').value,
          startDate: $('wfStart').value,
          endDate: $('wfEnd').value,
          capital: parseInt($('btCapital').value),
          trainRatio: parseInt($('wfTrain').value) / 100,
          windows: parseInt($('wfFolds').value),
        };
        if (!body.startDate || !body.endDate) {
          showToast('warning', '시작일/종료일을 입력하세요');
          $('btnWf').disabled = false;
          $('btnWf').textContent = '2단계: 워크포워드 검증';
          return;
        }
        try {
          var res = await api('/api/assets/backtest/walk-forward', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          });
          if (!res || !res.ok) {
            var err = await res.json().catch(function () {
              return {};
            });
            showToast('error', err.error || '워크포워드 실패');
            return;
          }
          var d = await res.json();
          var oos = d.oos || {};
          var analysis = d.analysis || {};
          var html = '<div class="res-box"><h4>워크포워드 검증 결과</h4>';
          html +=
            '<div class="metric"><span>평균 OOS 수익률</span><span class="' +
            ((oos.avgReturn || 0) >= 0 ? 'pos' : 'neg') +
            '">' +
            fmtPct(oos.avgReturn) +
            '</span></div>';
          html +=
            '<div class="metric"><span>체인 수익률</span><span>' + fmtPct(oos.totalChainedReturn) + '</span></div>';
          html +=
            '<div class="metric"><span>평균 샤프</span><span>' + (oos.avgSharpe || 0).toFixed(2) + '</span></div>';
          html +=
            '<div class="metric"><span>강건성</span><span>' +
            ((analysis.robustnessRatio || 0) * 100).toFixed(0) +
            '%</span></div>';
          html +=
            '<div class="metric"><span>일관성</span><span>' +
            ((analysis.consistencyRatio || 0) * 100).toFixed(0) +
            '%</span></div>';
          html += '<div class="metric"><span>판정</span><span>' + (analysis.verdict || '-') + '</span></div>';
          if (d.windowDetails) {
            html +=
              '<table style="margin-top:8px"><thead><tr><th>윈도우</th><th>Train 캔들</th><th>Test 캔들</th><th>OOS 수익률</th></tr></thead><tbody>';
            d.windowDetails.forEach(function (w) {
              html +=
                '<tr><td>#' +
                w.window +
                '</td><td>' +
                (w.period.train.candles || '-') +
                '</td><td>' +
                (w.period.test.candles || '-') +
                '</td><td class="' +
                ((w.test.totalReturn || 0) >= 0 ? 'pos' : 'neg') +
                '">' +
                fmtPct(w.test.totalReturn) +
                '</td></tr>';
            });
            html += '</tbody></table>';
          }
          html += '</div>';
          $('wfResult').innerHTML = html;
          showToast('ok', '워크포워드 검증 완료');
        } catch (e) {
          showToast('error', e.message);
        } finally {
          $('btnWf').disabled = false;
          $('btnWf').textContent = '2단계: 워크포워드 검증';
        }
      }

      async function loadBtHistory() {
        var res = await api('/api/assets/backtest');
        if (!res || !res.ok) return;
        var data = await res.json();
        var list = data.results || data || [];
        $('btHistory').innerHTML = list
          .slice(0, 20)
          .map(function (r) {
            var dateStr = r.period ? r.period.start || '-' : r.file ? r.file.replace(/.*_(\d+)\.json/, '$1') : '-';
            return (
              '<tr><td>' +
              dateStr +
              '</td><td>' +
              (r.period ? r.period.market || '-' : '-') +
              '</td><td>' +
              (r.strategy || '-') +
              '</td><td class="' +
              ((r.totalReturn || 0) >= 0 ? 'pos' : 'neg') +
              '">' +
              fmtPct(r.totalReturn) +
              '</td><td>' +
              (r.winRate != null ? (r.winRate * 100).toFixed(1) + '%' : '-') +
              '</td><td class="neg">' +
              ((r.maxDrawdown || 0) * 100).toFixed(1) +
              '%</td></tr>'
            );
          })
          .join('');
      }

      // ===== Reports =====
      async function loadRpSummary() {
        var res = await api('/api/trades/stats');
        if (!res || !res.ok) return;
        var d = await res.json();
        $('rpTrades').textContent = d.totalTrades || 0;
        var wr = d.totalTrades > 0 ? (((d.wins || 0) / d.totalTrades) * 100).toFixed(1) : '0.0';
        $('rpWinRate').textContent = wr + '%';
        $('rpProfit').textContent = fmtNum(d.totalPnl);
        $('rpAvg').textContent = fmtNum(d.avgPnl);
      }

      async function generateReport() {
        var res = await api('/api/reports/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ period: 'daily' }),
        });
        if (!res || !res.ok) {
          showToast('error', '리포트 생성 실패');
          return;
        }
        showToast('ok', '리포트 생성 완료');
        loadRpList();
      }

      async function loadRpList() {
        var res = await api('/api/reports');
        if (!res || !res.ok) return;
        var data = await res.json();
        var list = data.reports || data || [];
        $('rpList').innerHTML = list
          .map(function (r) {
            return (
              '<tr><td><a href="#" onclick="viewReport(\'' +
              r.file +
              '\');return false" style="color:#58a6ff">' +
              r.file +
              '</a></td><td>' +
              fmtDate(r.generatedAt) +
              '</td><td><a href="/api/reports/' +
              r.file +
              '/csv" download style="color:#58a6ff;margin-right:8px">CSV</a><a href="/api/reports/' +
              r.file +
              '/pdf" download style="color:#58a6ff">PDF</a></td></tr>'
            );
          })
          .join('');
      }

      async function viewReport(file) {
        var res = await api('/api/reports/' + encodeURIComponent(file));
        if (!res || !res.ok) return;
        var d = await res.json();
        var html = '<div class="res-box"><h4>' + file + '</h4>';
        if (d.summary) {
          html += '<div class="metric"><span>총 거래</span><span>' + (d.summary.totalTrades || 0) + '</span></div>';
          html += '<div class="metric"><span>총 수익</span><span>' + fmtNum(d.summary.totalPnl) + '</span></div>';
          html +=
            '<div class="metric"><span>승률</span><span>' +
            ((d.summary.winRate || 0) * 100).toFixed(1) +
            '%</span></div>';
        }
        html += '</div>';
        $('rpDetail').innerHTML = html;
      }

      // ===== Init =====
      // Set default walk-forward date range (last 90 days)
      (function () {
        var now = new Date();
        var end = now.toISOString().slice(0, 10);
        var start = new Date(now - 90 * 86400000).toISOString().slice(0, 10);
        $('wfStart').value = start;
        $('wfEnd').value = end;
      })();
      loadCandles();
      loadTrades();
      setInterval(loadTrades, 30000);
    </script>
  </body>
</html>
