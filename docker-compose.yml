services:
  app:
    build: .
    container_name: crypto-trading
    restart: unless-stopped
    ports:
      - "3008:3008"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3008/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
